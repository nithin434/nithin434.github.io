# Publishes the plain-HTML site in public/ to GitHub Pages.
# Live at https://nithin434.github.io/ — no build step, nothing server-side.
# Repo Settings → Pages → Source must be "GitHub Actions".
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # v3 keeps dot-folders such as public/.well-known in the upload; v4 drops
      # hidden files unless include-hidden-files is set, so check before bumping.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
